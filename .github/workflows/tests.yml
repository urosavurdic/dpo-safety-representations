name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Test
        run: |
          set -o pipefail
          python -m pytest tests/ -q -rf --tb=short 2>&1 | tee pytest.log

      - name: Surface failures publicly
        # Run logs need a signed-in session; annotations and the job summary do
        # not. Without this a failure is a bare "exit code 1" to anyone who
        # cannot open the log.
        if: always()
        run: |
          {
            echo '## pytest'
            echo '```'
            tail -40 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAILED|ERROR)' pytest.log | while read -r line; do
            echo "::error::$line"
          done || true

      - name: Import from outside the repo root
        # pythonpath=["."] would mask a broken package declaration, so this
        # step imports the installed package from a directory that is not the
        # checkout.
        run: |
          cd /tmp
          python -c "import src.common.stats, src.common.refusal_classifier; print('ok')"
