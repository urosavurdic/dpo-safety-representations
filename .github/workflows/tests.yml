name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Test
        run: python -m pytest tests/ -q

      - name: Import from outside the repo root
        # pythonpath=["."] would mask a broken package declaration, so this
        # step imports the installed package from a directory that is not the
        # checkout.
        run: |
          cd /tmp
          python -c "import src.common.stats, src.common.refusal_classifier; print('ok')"
