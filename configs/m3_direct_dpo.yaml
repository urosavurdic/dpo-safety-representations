# M3-direct: DPO trained directly from M1 (SFT-helpful), skipping the
# safety-SFT step entirely. Isolates whether DPO's effect depends on prior
# safety-SFT (M2) having already reshaped the model, or whether DPO alone
# reaches a similar place. PRIMARY comparison: vs. M2 (both start from M1,
# same data, method differs -- clean two-arm test). Comparison vs. M3 is
# informative but confounded (M3 has been through two training stages,
# M3-direct only one) -- report with that caveat, not as equally clean.
#
# Everything below is IDENTICAL to m3_dpo.yaml except:
#   - model.init_from_adapter (M1 instead of M2)
#   - output.base_dir / output.hf_repo (new destination, doesn't touch real M3)
#   - experiment_name / wandb.run_name

experiment_name: m3_direct_dpo
seed: 42

model:
  name: Qwen/Qwen2.5-1.5B
  trust_remote_code: true
  init_from_adapter: urosavurdic/qwen2.5-1.5b-m1-helpful   # <- the actual change

dataset:
  path: data/processed/dpo_pairs.jsonl   # unchanged -- same data, matched design

output:
  base_dir: /content/drive/MyDrive/dpo-safety/models/m3_direct
  hf_repo: urosavurdic/qwen2.5-1.5b-m3-direct-dpo
  push_to_hub: true

training:
  num_train_epochs: 1
  max_steps: -1
  learning_rate: 5.0e-5
  batch_size: 2
  gradient_accumulation_steps: 16
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 20
  save_total_limit: 3
  max_seq_length: 1024
  gradient_checkpointing: true
  bf16: false
  fp16: true

dpo:
  beta: 0.1
  loss_type: sigmoid

lora:
  r: 64
  alpha: 128
  dropout: 0.05

wandb:
  project: dpo-safety-representations
  run_name: m3_direct_dpo