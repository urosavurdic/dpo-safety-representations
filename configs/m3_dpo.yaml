experiment_name: m3_dpo
seed: 42

model:
  name: Qwen/Qwen2.5-1.5B
  trust_remote_code: true
  init_from_adapter: urosavurdic/qwen2.5-1.5b-m2-safety

dataset:
  path: data/processed/dpo_pairs.jsonl

output:
  base_dir: /content/drive/MyDrive/dpo-safety/models/m3
  hf_repo: urosavurdic/qwen2.5-1.5b-m3-dpo
  push_to_hub: true

training:
  num_train_epochs: 1
  max_steps: -1
  learning_rate: 5.0e-5
  batch_size: 16
  gradient_accumulation_steps: 8
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 20
  save_total_limit: 3
  max_seq_length: 1024
  gradient_checkpointing: true
  bf16: false
  fp16: true

dpo:
  beta: 0.1
  loss_type: sigmoid

lora:
  r: 64
  alpha: 128
  dropout: 0.05

wandb:
  project: dpo-safety-representations
  run_name: m3_dpo