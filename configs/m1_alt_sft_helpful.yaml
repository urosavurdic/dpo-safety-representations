# M1_alt: SFT-helpful on databricks-dolly-15k instead of Alpaca. Data-
# dependence probe for Finding 3 (README) - the M0->M1 refusal-direction
# rotation is by far the biggest of any adjacent-stage transition, on a
# dataset (Alpaca) that was itself GENERATED by an already-RLHF'd model
# (text-davinci-003). Dolly is human-written from scratch, no aligned-LLM
# generation step - a genuinely different, more neutral contrast. Tests
# whether that big rotation is Alpaca-specific or a general property of
# generic instruction-tuning. See PROJECT_CONTEXT.md M1_alt notes.
#
# Everything below is IDENTICAL to m1_sft_helpful.yaml except:
#   - dataset.path (data/processed/sft_helpful_alt.jsonl, built via
#     `python -m src.data_pipeline.build_m1_data --dataset dolly`)
#   - output.base_dir / output.hf_repo
#   - experiment_name / wandb.run_name

experiment_name: m1_alt_sft_helpful
seed: 42

model:
  name: Qwen/Qwen2.5-1.5B
  trust_remote_code: true

dataset:
  path: data/processed/sft_helpful_alt.jsonl

output:
  base_dir: /content/drive/MyDrive/dpo-safety/models/m1_alt
  hf_repo: urosavurdic/qwen2.5-1.5b-m1-alt-helpful
  push_to_hub: true

training:
  num_train_epochs: 2
  max_steps: -1
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  max_seq_length: 1024
  gradient_checkpointing: true
  bf16: false
  fp16: true

lora:
  r: 64
  alpha: 128
  dropout: 0.05

wandb:
  project: dpo-safety-representations
  run_name: m1_alt_sft_helpful
