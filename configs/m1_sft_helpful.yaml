experiment_name: m1_sft_helpful
seed: 42

model:
  name: Qwen/Qwen2.5-1.5B
  trust_remote_code: true

dataset:
  path: data/processed/sft_helpful.jsonl

output:
  base_dir: /content/drive/MyDrive/dpo-safety/models/m1
  hf_repo: urosavurdic/qwen2.5-1.5b-m1-helpful
  push_to_hub: true

training:
  num_train_epochs: 2
  max_steps: -1
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  max_seq_length: 1024
  gradient_checkpointing: true
  bf16: false
  fp16: true

lora:
  r: 64
  alpha: 128
  dropout: 0.05

wandb:
  project: dpo-safety-representations
  run_name: m1_sft_helpful