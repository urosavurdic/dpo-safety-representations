experiment_name: m1_alt_gpu_dryrun
seed: 42

model:
  name: Qwen/Qwen2.5-1.5B
  trust_remote_code: true

dataset:
  path: data/processed/sft_helpful_alt.jsonl
  max_samples: 20

output:
  base_dir: /content/drive/MyDrive/dpo-safety/models/m1_alt_dryrun
  hf_repo: null
  push_to_hub: false

training:
  num_train_epochs: 1
  max_steps: 5
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_accumulation_steps: 8
  warmup_ratio: 0.0
  weight_decay: 0.01
  logging_steps: 1
  save_steps: 2
  save_total_limit: 2
  max_seq_length: 1024
  gradient_checkpointing: true
  bf16: false
  fp16: true

lora:
  r: 64
  alpha: 128
  dropout: 0.05

wandb:
  project: null
  run_name: null
